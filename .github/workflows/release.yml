name: Release Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-evidence:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize checkout line endings
        if: runner.os == 'Windows'
        run: |
          git config core.autocrlf false
          git reset --hard HEAD

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build artifacts
        run: |
          cargo build --release -p brownie-runtime
          pnpm build

      - name: Package Unix runtime artifact
        if: runner.os != 'Windows'
        run: |
          mkdir -p release-artifacts
          tar -czf "release-artifacts/brownie-runtime-${{ runner.os }}.tar.gz" -C target/release brownie-runtime

      - name: Package Windows runtime artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Compress-Archive -Path target/release/brownie-runtime.exe -DestinationPath release-artifacts/brownie-runtime-Windows.zip -Force

      - name: Run supply chain artifact evidence
        run: pnpm --workspace-root guard:supply-chain-artifact-evidence

      - name: Run release gate contract guard
        run: pnpm --workspace-root guard:release-gate

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: |
            extensions/brownie-vsix/dist/
            extensions/brownie-vsix/package.json
            release-artifacts/
          if-no-files-found: error
          retention-days: 7
