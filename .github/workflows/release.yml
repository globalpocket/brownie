name: Release Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-evidence:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize checkout line endings
        if: runner.os == 'Windows'
        run: |
          git config core.autocrlf false
          git reset --hard HEAD

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build VSIX
        run: |
          pnpm build

      - name: Verify clean source identity
        shell: bash
        run: git diff-index --quiet HEAD --

      - name: Verify release artifact contract
        run: pnpm --workspace-root release:local-artifact:test

      - name: Build and exercise distributable Runtime CLI
        run: pnpm --workspace-root release:local-artifact -- --target ${{ matrix.target }}

      - name: Generate and validate supply chain artifact evidence
        run: |
          pnpm --workspace-root release:supply-chain-artifact-evidence
          pnpm --workspace-root guard:supply-chain-artifact-evidence

      - name: Run release gate contract guard
        run: pnpm --workspace-root guard:release-gate

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            extensions/brownie-vsix/dist/
            extensions/brownie-vsix/package.json
            .brownie/release-evidence/artifacts/${{ matrix.target }}/
            .brownie/release-evidence/brownie-runtime-provenance.json
            .brownie/release-evidence/supply-chain-artifact-evidence.json
            .brownie/release-evidence/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
