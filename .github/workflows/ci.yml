name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --workspace --all-targets --all-features

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Cargo test
        run: cargo test --workspace --all-features

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm dependencies
        run: pnpm install

      - name: Diagnostics guard
        run: pnpm guard:diagnostics

      - name: Phase value guard
        run: pnpm guard:phase-value

      - name: Phase value guard tests
        run: pnpm guard:phase-value:test

      - name: VSIX check
        run: pnpm --filter brownie-vsix check

      - name: VSIX test
        run: pnpm --filter brownie-vsix test

      - name: VSIX build
        run: pnpm --filter brownie-vsix build

  runtime-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cargo check
        run: cargo check --workspace --all-targets --all-features

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Runtime cargo test
        if: runner.os != 'Windows'
        run: cargo test -p brownie-runtime --all-features

      - name: Verify unsupported index platform fails closed
        if: runner.os == 'Windows'
        run: cargo test -p brownie-indexer unsupported_platform_fails_closed

  index-platform:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cargo check
        run: cargo check --workspace --all-targets --all-features

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Verify unsupported index platform fails closed
        run: cargo test -p brownie-indexer unsupported_platform_fails_closed
