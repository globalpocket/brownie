name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Public materialization receipts validate a historical merge and
          # both of its parents; the default shallow checkout cannot do so.
          fetch-depth: 0

      - name: Fetch approved phase-loop controller baseline
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Materialize and verify selected phase-loop deployment
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PHASE_LOOP_IMPLEMENTATION_PR_BRANCH_PATTERN: ${{ vars.PHASE_LOOP_IMPLEMENTATION_PR_BRANCH_PATTERN }}
          PHASE_LOOP_IMPLEMENTATION_PR_ACTOR: ${{ vars.PHASE_LOOP_IMPLEMENTATION_PR_ACTOR }}
          PHASE_LOOP_IMPLEMENTATION_BRANCH_PREFIXES: ${{ vars.PHASE_LOOP_IMPLEMENTATION_BRANCH_PREFIXES }}
          PHASE_LOOP_REVIEW_ACTOR: ${{ vars.PHASE_LOOP_REVIEW_ACTOR }}
          PHASE_LOOP_MERGE_ACTOR: ${{ vars.PHASE_LOOP_MERGE_ACTOR }}
          PHASE_LOOP_REJECTED_HEAD_SHA: ${{ vars.PHASE_LOOP_REJECTED_HEAD_SHA }}
          PHASE_LOOP_REJECTED_PR_NUMBER: ${{ vars.PHASE_LOOP_REJECTED_PR_NUMBER }}
        run: |
          if [ -z "$PHASE_LOOP_IMPLEMENTATION_PR_BRANCH_PATTERN" ]; then
            echo "No phase-loop implementation PR admission selector is configured; skipping role-specific admission."
            exit 0
          fi
          if ! printf '%s\n' "$PR_HEAD_REF" | grep -Eq "^(${PHASE_LOOP_IMPLEMENTATION_PR_BRANCH_PATTERN})$"; then
            exit 0
          fi
          for required in PHASE_LOOP_IMPLEMENTATION_PR_ACTOR PHASE_LOOP_IMPLEMENTATION_BRANCH_PREFIXES PHASE_LOOP_REVIEW_ACTOR PHASE_LOOP_MERGE_ACTOR; do
            if [ -z "${!required}" ]; then
              echo "Selected phase-loop deployment is incomplete: $required is not configured." >&2
              exit 1
            fi
          done
          if [ "$PR_AUTHOR" != "$PHASE_LOOP_IMPLEMENTATION_PR_ACTOR" ]; then
            echo "Implementation pull-request author guard failed: configured=$PHASE_LOOP_IMPLEMENTATION_PR_ACTOR actual=$PR_AUTHOR" >&2
            exit 1
          fi
          PHASE_LOOP_DEPLOYMENT_FILE="$RUNNER_TEMP/phase-loop-actor-deployment.json"
          export PHASE_LOOP_DEPLOYMENT_FILE
          python3 - <<'PY'
          import json
          import os
          import sys

          try:
              prefixes = json.loads(os.environ['PHASE_LOOP_IMPLEMENTATION_BRANCH_PREFIXES'])
          except json.JSONDecodeError as error:
              raise SystemExit(f'PHASE_LOOP_IMPLEMENTATION_BRANCH_PREFIXES must be a JSON array: {error}')
          if not isinstance(prefixes, list) or not prefixes or any(not isinstance(value, str) or not value.strip() for value in prefixes):
              raise SystemExit('PHASE_LOOP_IMPLEMENTATION_BRANCH_PREFIXES must be a non-empty JSON array of non-empty strings.')
          deployment = {
              'schema_version': 1,
              'repository': os.environ['GITHUB_REPOSITORY'],
              'roles': {
                  'implementation': {
                      'github_login': os.environ['PHASE_LOOP_IMPLEMENTATION_PR_ACTOR'],
                      'branch_prefixes': prefixes,
                  },
                  'review': {'github_login': os.environ['PHASE_LOOP_REVIEW_ACTOR']},
                  'merge': {'github_login': os.environ['PHASE_LOOP_MERGE_ACTOR']},
              },
              'constraints': {'require_independent_review': True},
          }
          with open(os.environ['PHASE_LOOP_DEPLOYMENT_FILE'], 'w', encoding='utf-8') as output:
              json.dump(deployment, output)
              output.write('\n')
          PY
          chmod 600 "$PHASE_LOOP_DEPLOYMENT_FILE"
          node scripts/phase-loop-actor-deployment.mjs --deployment "$PHASE_LOOP_DEPLOYMENT_FILE" --role implementation --field repository >/dev/null
          if [ -n "$PHASE_LOOP_REJECTED_HEAD_SHA" ] || [ -n "$PHASE_LOOP_REJECTED_PR_NUMBER" ]; then
            node scripts/phase-loop-pr-author-guard.mjs --event-path "$GITHUB_EVENT_PATH"
          fi
          echo "Selected phase-loop deployment and implementation pull-request author guard passed for $PR_HEAD_REF."

      - name: Fail closed on stale phase-loop controller source
        run: |
          node --test scripts/phase-loop-source-baseline-guard.test.mjs
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            node scripts/phase-loop-source-baseline-guard.mjs --repo . --baseline-ref origin/main
          fi

      - name: Fail fast on stale runtime readiness evidence
        run: node scripts/update-runtime-release-readiness-audit.mjs --check

      - name: Fail fast on stale runtime module assessment
        run: node scripts/update-runtime-module-decomposition-assessment.mjs --check

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --workspace --all-targets --all-features

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Cargo test
        run: cargo test --workspace --all-features

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Root workspace check
        timeout-minutes: 15
        run: pnpm --workspace-root check

      - name: Root workspace test
        run: pnpm --workspace-root test

      - name: Root workspace build
        run: pnpm --workspace-root build

      - name: Release gate
        run: pnpm guard:release-gate

      - name: Process-loss E2E test
        run: pnpm test:rrp3-process-loss

      - name: Diagnostics guard
        run: pnpm guard:diagnostics

      - name: Phase value guard
        run: pnpm guard:phase-value

      - name: Phase value guard tests
        run: pnpm guard:phase-value:test

      - name: VSIX check
        run: pnpm --filter brownie-vsix check

      - name: VSIX test
        run: pnpm --filter brownie-vsix test

      - name: VSIX build
        run: pnpm --filter brownie-vsix build

  runtime-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fail fast on stale runtime readiness evidence
        run: node scripts/update-runtime-release-readiness-audit.mjs --check

      - name: Fail fast on stale runtime module assessment
        run: node scripts/update-runtime-module-decomposition-assessment.mjs --check

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cargo check
        run: cargo check --workspace --all-targets --all-features

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Runtime cargo test
        if: runner.os != 'Windows'
        run: cargo test -p brownie-runtime --all-features

      - name: Verify unsupported index platform fails closed
        if: runner.os == 'Windows'
        run: cargo test -p brownie-indexer unsupported_platform_fails_closed

  index-platform:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fail fast on stale runtime readiness evidence
        run: node scripts/update-runtime-release-readiness-audit.mjs --check

      - name: Fail fast on stale runtime module assessment
        run: node scripts/update-runtime-module-decomposition-assessment.mjs --check

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cargo check
        run: cargo check --workspace --all-targets --all-features

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Verify unsupported index platform fails closed
        run: cargo test -p brownie-indexer unsupported_platform_fails_closed
