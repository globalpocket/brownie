[workspace]
members = [
  "crates/brownie-common",
  "crates/brownie-config",
  "crates/brownie-protocol",
  "crates/brownie-runtime",
  "crates/brownie-cli",
  "crates/brownie-agent-loop",
  "crates/brownie-agentmodes",
  "crates/brownie-modepack",
  "crates/brownie-context",
  "crates/brownie-tools",
  "crates/brownie-llm",
  "crates/brownie-llama",
  "crates/brownie-qdrant",
  "crates/brownie-indexer",
  "crates/brownie-store",
  "crates/brownie-events"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false
repository = "https://github.com/globalpocket/brownie"
rust-version = "1.78"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
libc = "0.2"
ignore = "0.4"
tokio = { version = "1", features = ["full"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
url = "2"
